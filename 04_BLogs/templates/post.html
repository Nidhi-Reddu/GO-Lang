
{{ define "title" }}{{ .Headline }} | MyBlogs{{ end }}

{{ define "content" }}

<main class="mx-auto max-w-4xl px-4 py-8 sm:px-6 sm:py-12">

    <!-- Blog Post -->
    <article class="overflow-hidden rounded-2xl border border-gray-200
                    bg-white shadow-lg dark:border-gray-700 dark:bg-gray-800">

        <div class="p-6 sm:p-8 md:p-12">

            <!-- Category -->
            <div class="mb-5">
                <span class="inline-flex items-center gap-2 rounded-full
                             bg-cyan-100 px-3 py-1 text-sm font-medium
                             text-cyan-800 dark:bg-cyan-950
                             dark:text-cyan-300">
                    <i class="fa-solid fa-folder-open"></i>
                    {{ .Category }}
                </span>
            </div>

            <!-- Post Title -->
            <h1 class="mb-6 text-3xl font-bold leading-tight
                       text-gray-900 sm:text-4xl dark:text-white">
                {{ .Headline }}
            </h1>

            <!-- Post Metadata -->
            <div class="flex flex-wrap items-center gap-x-6 gap-y-3
                        border-b border-gray-200 pb-6 text-sm
                        text-gray-500 dark:border-gray-700
                        dark:text-gray-400">

                <span class="inline-flex items-center gap-2">
                    <i class="fa-regular fa-calendar text-cyan-500"></i>
                    {{ .CreatedAt.Format "02 Jan 2006" }}
                </span>

                <span class="inline-flex items-center gap-2">
                    <i class="fa-solid fa-user text-cyan-500"></i>
                    By {{ .Author }}
                </span>

            </div>

            <!-- Post Content -->
            <div class="mt-8 whitespace-pre-line break-words
                        text-base leading-8 text-gray-700
                        dark:text-gray-200">
                {{ .Content }}
            </div>


            <!-- Post Actions -->
            <div class="mt-10 flex flex-col gap-4 border-t
                        border-gray-200 pt-6 sm:flex-row
                        sm:flex-wrap sm:items-center
                        dark:border-gray-700">

                <!-- Back to Posts -->
                <a
                    href="/"
                    class="inline-flex items-center justify-center gap-2
                           rounded-lg border border-gray-300 px-5 py-3
                           font-semibold text-gray-700 transition
                           hover:bg-gray-100 dark:border-gray-600
                           dark:text-gray-200 dark:hover:bg-gray-700"
                >
                    <i class="fa-solid fa-arrow-left"></i>
                    Back to Posts
                </a>

                <div class="flex flex-wrap gap-3">

                    <!-- Edit Post -->
                    <a
                        href="/edit_post?id={{ .ID }}"
                        class="inline-flex items-center justify-center gap-2
                               rounded-lg bg-cyan-500 px-5 py-3
                               font-semibold text-gray-950 transition
                               hover:bg-cyan-400"
                    >
                        <i class="fa-solid fa-pen-to-square"></i>
                        Edit Post
                    </a>

                    <!-- Delete Post -->
                    <form
                        action="/delete_post?id={{ .ID }}"
                        method="POST"
                        onsubmit="return confirm('Are you sure you want to delete this post? This action cannot be undone.');"
                    >
                        <button
                            type="submit"
                            class="inline-flex items-center justify-center gap-2
                                   rounded-lg bg-red-600 px-5 py-3
                                   font-semibold text-white transition
                                   hover:bg-red-500 focus:outline-none
                                   focus:ring-2 focus:ring-red-500
                                   focus:ring-offset-2
                                   dark:focus:ring-offset-gray-800"
                        >
                            <i class="fa-solid fa-trash"></i>
                            Delete Post
                        </button>
                    </form>

                </div>

            </div>

        </div>

    </article>


    <!-- Bottom Navigation -->
    <div class="mt-6 text-center">

        <a href="/"
           class="inline-flex items-center gap-2 text-sm
                  font-medium text-gray-500 transition
                  hover:text-cyan-600 dark:text-gray-400
                  dark:hover:text-cyan-400">
            <i class="fa-solid fa-house"></i>
            Return to MyBlogs
        </a>

    </div>

</main>

{{ end }}
