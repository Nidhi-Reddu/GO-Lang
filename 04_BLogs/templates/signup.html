
{{ define "title" }}Sign Up | MyBlogs{{ end }}

{{ define "content" }}

<div class="mx-auto w-full max-w-md">

    <!-- Heading -->
    <div class="mb-8 text-center">

        <div class="mb-5 inline-flex h-16 w-16 items-center justify-center
                    rounded-2xl bg-cyan-100 text-cyan-700
                    dark:bg-cyan-950 dark:text-cyan-400">
            <i class="fa-solid fa-user-plus text-3xl"></i>
        </div>

        <h1 class="mb-3 text-3xl font-bold text-gray-900 dark:text-white">
            Create Your Account
        </h1>

        <p class="text-gray-600 dark:text-gray-400">
            Join MyBlogs and start sharing your ideas.
        </p>

    </div>


    <!-- Signup Card -->
    <div class="rounded-2xl border border-gray-200 bg-white p-6
                shadow-lg sm:p-8 dark:border-gray-700 dark:bg-gray-800">

        <form action="/signup" method="POST" class="space-y-5">

            <!-- Name -->
            <div>

                <label for="name"
                       class="mb-2 block font-semibold text-gray-800
                              dark:text-gray-200">
                    Full Name
                </label>

                <div class="relative">

                    <i class="fa-solid fa-user pointer-events-none
                              absolute left-4 top-1/2 -translate-y-1/2
                              text-gray-400"></i>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your name"
                        autocomplete="name"
                        required
                        class="w-full rounded-lg border border-gray-300
                               bg-gray-50 py-3 pl-11 pr-4 text-gray-900
                               placeholder-gray-400 outline-none transition
                               focus:border-cyan-500 focus:ring-2
                               focus:ring-cyan-500/30
                               dark:border-gray-600 dark:bg-gray-700
                               dark:text-white dark:placeholder-gray-400"
                    >

                </div>

            </div>


            <!-- Email -->
            <div>

                <label for="email"
                       class="mb-2 block font-semibold text-gray-800
                              dark:text-gray-200">
                    Email Address
                </label>

                <div class="relative">

                    <i class="fa-solid fa-envelope pointer-events-none
                              absolute left-4 top-1/2 -translate-y-1/2
                              text-gray-400"></i>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                        class="w-full rounded-lg border border-gray-300
                               bg-gray-50 py-3 pl-11 pr-4 text-gray-900
                               placeholder-gray-400 outline-none transition
                               focus:border-cyan-500 focus:ring-2
                               focus:ring-cyan-500/30
                               dark:border-gray-600 dark:bg-gray-700
                               dark:text-white dark:placeholder-gray-400"
                    >

                </div>

            </div>


            <!-- Password -->
            <div>

                <label for="password"
                       class="mb-2 block font-semibold text-gray-800
                              dark:text-gray-200">
                    Password
                </label>

                <div class="relative">

                    <i class="fa-solid fa-lock pointer-events-none
                              absolute left-4 top-1/2 -translate-y-1/2
                              text-gray-400"></i>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        minlength="8"
                        required
                        class="w-full rounded-lg border border-gray-300
                               bg-gray-50 py-3 pl-11 pr-4 text-gray-900
                               placeholder-gray-400 outline-none transition
                               focus:border-cyan-500 focus:ring-2
                               focus:ring-cyan-500/30
                               dark:border-gray-600 dark:bg-gray-700
                               dark:text-white dark:placeholder-gray-400"
                    >

                </div>

                <p class="mt-2 text-sm text-gray-500 dark:text-gray-400">
                    Use at least 8 characters.
                </p>

            </div>


            <!-- Create Account Button -->
            <button
                type="submit"
                class="flex w-full items-center justify-center gap-2
                       rounded-lg bg-cyan-500 px-6 py-3 font-semibold
                       text-gray-950 shadow-sm transition
                       hover:bg-cyan-400 focus:outline-none
                       focus:ring-2 focus:ring-cyan-500
                       focus:ring-offset-2
                       dark:focus:ring-offset-gray-800"
            >
                <i class="fa-solid fa-user-plus"></i>
                Create Account
            </button>

        </form>


        <!-- Divider -->
        <div class="my-6 flex items-center gap-4">
            <div class="h-px flex-1 bg-gray-200 dark:bg-gray-700"></div>

            <span class="text-sm text-gray-500 dark:text-gray-400">
                Already a member?
            </span>

            <div class="h-px flex-1 bg-gray-200 dark:bg-gray-700"></div>
        </div>


        <!-- Login Link -->
        <div class="text-center">

            <p class="text-gray-600 dark:text-gray-400">
                Already have an account?

                <a href="/login"
                   class="ml-1 font-semibold text-cyan-600 transition
                          hover:text-cyan-500 hover:underline
                          dark:text-cyan-400 dark:hover:text-cyan-300">
                    Login
                </a>
            </p>

        </div>

    </div>


    <!-- Back to Home -->
    <div class="mt-6 text-center">

        <a href="/"
           class="inline-flex items-center gap-2 text-sm
                  text-gray-500 transition hover:text-cyan-600
                  dark:text-gray-400 dark:hover:text-cyan-400">
            <i class="fa-solid fa-arrow-left"></i>
            Back to Home
        </a>

    </div>

</div>

{{ end }}
