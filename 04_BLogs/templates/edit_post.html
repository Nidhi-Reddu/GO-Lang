
{{ define "title" }}Edit Post | MyBlogs{{ end }}

{{ define "content" }}

<div class="mx-auto max-w-3xl">

    <!-- Page Heading -->
    <div class="mb-8 text-center">

        <div class="mb-4 inline-flex h-14 w-14 items-center justify-center
                    rounded-2xl bg-cyan-100 text-cyan-700
                    dark:bg-cyan-950 dark:text-cyan-400">
            <i class="fa-solid fa-pen-to-square text-2xl"></i>
        </div>

        <h1 class="mb-3 text-3xl font-bold text-gray-900 dark:text-white">
            Edit Post
        </h1>

        <p class="text-gray-600 dark:text-gray-400">
            Update your article and save your changes.
        </p>

    </div>


    <!-- Edit Post Form -->
    <div class="rounded-2xl border border-gray-200 bg-white p-6
                shadow-lg sm:p-8 dark:border-gray-700 dark:bg-gray-800">

        <form action="/edit_post?id={{ .ID }}" method="POST"
              class="space-y-6">

            <!-- Post Title -->
            <div>

                <label for="headline"
                       class="mb-2 block font-semibold text-gray-800
                              dark:text-gray-200">
                    Post Headline
                    <span class="text-red-500">*</span>
                </label>

                <input
                    type="text"
                    id="headline"
                    name="headline"
                    value="{{ .Headline }}"
                    placeholder="Enter your post headline"
                    maxlength="200"
                    required
                    class="w-full rounded-lg border border-gray-300
                           bg-gray-50 px-4 py-3 text-gray-900
                           placeholder-gray-400 outline-none transition
                           focus:border-cyan-500 focus:ring-2
                           focus:ring-cyan-500/30
                           dark:border-gray-600 dark:bg-gray-700
                           dark:text-white dark:placeholder-gray-400"
                >

            </div>


            <!-- Post Category -->
            <div>

                <label for="category"
                       class="mb-2 block font-semibold text-gray-800
                              dark:text-gray-200">
                    Category
                    <span class="text-red-500">*</span>
                </label>

                <div class="relative">

                    <i class="fa-solid fa-folder-open pointer-events-none
                              absolute left-4 top-1/2 -translate-y-1/2
                              text-gray-400"></i>

                    <input
                        type="text"
                        id="category"
                        name="category"
                        value="{{ .Category }}"
                        placeholder="Example: Go Programming"
                        required
                        class="w-full rounded-lg border border-gray-300
                               bg-gray-50 py-3 pl-11 pr-4 text-gray-900
                               placeholder-gray-400 outline-none transition
                               focus:border-cyan-500 focus:ring-2
                               focus:ring-cyan-500/30
                               dark:border-gray-600 dark:bg-gray-700
                               dark:text-white dark:placeholder-gray-400"
                    >

                </div>

            </div>


            <!-- Post Content -->
            <div>

                <label for="content"
                       class="mb-2 block font-semibold text-gray-800
                              dark:text-gray-200">
                    Post Content
                    <span class="text-red-500">*</span>
                </label>

                <textarea
                    id="content"
                    name="content"
                    rows="12"
                    required
                    placeholder="Write your blog post here..."
                    class="w-full resize-y rounded-lg border border-gray-300
                           bg-gray-50 px-4 py-3 leading-7 text-gray-900
                           placeholder-gray-400 outline-none transition
                           focus:border-cyan-500 focus:ring-2
                           focus:ring-cyan-500/30
                           dark:border-gray-600 dark:bg-gray-700
                           dark:text-white dark:placeholder-gray-400"
                >{{ .Content }}</textarea>

                <p class="mt-2 text-sm text-gray-500 dark:text-gray-400">
                    Review your updated content before saving.
                </p>

            </div>


            <!-- Form Actions -->
            <div class="flex flex-col-reverse gap-3 border-t
                        border-gray-200 pt-6 sm:flex-row sm:items-center
                        sm:justify-between dark:border-gray-700">

                <!-- Cancel -->
                <a
                    href="/post?id={{ .ID }}"
                    class="inline-flex items-center justify-center gap-2
                           rounded-lg border border-gray-300 px-6 py-3
                           font-semibold text-gray-700 transition
                           hover:bg-gray-100
                           dark:border-gray-600 dark:text-gray-200
                           dark:hover:bg-gray-700"
                >
                    <i class="fa-solid fa-arrow-left"></i>
                    Cancel
                </a>

                <!-- Save Changes -->
                <button
                    type="submit"
                    class="inline-flex items-center justify-center gap-2
                           rounded-lg bg-cyan-500 px-6 py-3 font-semibold
                           text-gray-950 shadow-sm transition
                           hover:bg-cyan-400 focus:outline-none
                           focus:ring-2 focus:ring-cyan-500
                           focus:ring-offset-2
                           dark:focus:ring-offset-gray-800"
                >
                    <i class="fa-solid fa-floppy-disk"></i>
                    Save Changes
                </button>

            </div>

        </form>

    </div>


    <!-- Helpful Note -->
    <p class="mt-6 text-center text-sm text-gray-500 dark:text-gray-400">
        <i class="fa-solid fa-circle-info mr-1 text-cyan-500"></i>
        Your changes will be submitted when you click Save Changes.
    </p>

</div>

{{ end }}
